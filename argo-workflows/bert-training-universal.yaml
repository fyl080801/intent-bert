apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: bert-training-universal
  namespace: dev
  labels:
    app: bert-finetune
    project: universal-bert-training
    workflow-type: universal-training
  annotations:
    description: "通用BERT微调工作流 - 支持单标签、多标签、多级标签的参数化训练"
spec:
  serviceAccountName: bert-workflow-sa
  activeDeadlineSeconds: 14400
  retryStrategy:
    limit: 2
    retryPolicy: "OnError"

  entrypoint: universal-training-pipeline

  arguments:
    parameters:
      # ============== 数据集选择（核心参数）=============
      - name: dataset_name
        value: "financial_intent_fixed"  # 数据集名称，在dataset_registry.json中定义
      - name: dataset_registry_path
        value: "datasets/dataset_registry.json"  # 数据集注册表路径

      # ============== Git 仓库配置 ==============
      - name: repo_url
        value: "https://github.com/fyl080801/intent-bert.git"
      - name: branch
        value: "configlabels"
      - name: git_revision
        value: ""

      # ============== 存储配置 ==============
      - name: pvc_name
        value: "bert-training-data-pvc"
      - name: host_model_download_path
        value: "/mnt/models/cache"
      - name: host_model_output_base_path
        value: "/mnt/models/bert-output"
      - name: container_model_cache_path
        value: "/app/.cache/models"
      - name: container_model_output_path
        value: "/app/models"
      - name: container_data_path
        value: "/data"

      # ============== 训练超参数（可选，会覆盖数据集配置）=============
      - name: model_name
        value: ""  # 空值表示使用数据集配置的默认值
      - name: batch_size
        value: ""  # 空值表示使用数据集配置的默认值
      - name: num_epochs
        value: ""
      - name: learning_rate
        value: ""
      - name: max_length
        value: ""
      - name: warmup_steps
        value: ""
      - name: weight_decay
        value: ""
      - name: model_version
        value: "v1"  # 动态模型版本（v1或v2）

      # ============== 输出配置 ==============
      - name: training_timestamp
        value: "{{workflow.creationTimestamp}}"
      - name: output_suffix
        value: "{{workflow.uid}}"  # 输出目录后缀

      # ============== 镜像配置 ==============
      - name: image_registry
        value: "192.168.68.95:31443"
      - name: image_repository
        value: "ai-apps/intent-bert"
      - name: image_tag
        value: "latest"

      # ============== 代理配置 ==============
      - name: https_proxy
        value: "http://192.168.68.95:25041"
      - name: http_proxy
        value: "http://192.168.68.95:25041"

  volumeClaimTemplates:
    - metadata:
        name: workspace-volume
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

  templates:
    # ==================== 1. 拉取源码 ====================
    - name: checkout-source
      inputs:
        parameters:
          - name: repo_url
          - name: branch
          - name: git_revision
      outputs:
        artifacts:
          - name: source-code
            path: /src
      script:
        image: 192.168.68.95:31443/docker.io/alpine/git:latest
        command: [sh, -c]
        source: |
          set -e
          echo "=========================================="
          echo "步骤1: 拉取源码"
          echo "=========================================="

          REPO_URL="{{inputs.parameters.repo_url}}"
          BRANCH="{{inputs.parameters.branch}}"
          REVISION="{{inputs.parameters.git_revision}}"

          if [ -n "$REVISION" ]; then
              echo "使用指定Revision: $REVISION"
              git clone --depth 1 --branch "$BRANCH" "$REPO_URL" /src
              cd /src
              git checkout "$REVISION"
          else
              echo "使用分支: $BRANCH"
              git clone --depth 1 --branch "$BRANCH" "$REPO_URL" /src
          fi

          echo "✓ 源码拉取完成"
          echo "Commit: $(cd /src && git rev-parse HEAD)"
        env:
          - name: HTTPS_PROXY
            value: "http://192.168.68.95:25041"
          - name: HTTP_PROXY
            value: "http://192.168.68.95:25041"
        volumeMounts:
          - name: workspace-volume
            mountPath: /src
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"

    # ==================== 2. 解析数据集配置 ====================
    - name: parse-dataset-config
      inputs:
        parameters:
          - name: dataset_name
          - name: dataset_registry_path
          - name: container_data_path
        artifacts:
          - name: source-code
            path: /src
      outputs:
        artifacts:
          - name: dataset-config
            path: /tmp/dataset_config.json
      volumes:
        - name: training-data-pvc
          persistentVolumeClaim:
            claimName: "{{workflow.parameters.pvc_name}}"
      script:
        image: 192.168.68.95:31443/docker.io/library/python:3.10-slim
        command: [python3]
        source: |
          import json
          import os
          import sys

          print("=" * 60)
          print("步骤2: 解析数据集配置")
          print("=" * 60)

          # 切换到源码目录
          os.chdir('/src')

          registry_path = "{{inputs.parameters.dataset_registry_path}}"
          dataset_name = "{{inputs.parameters.dataset_name}}"
          data_path = "{{inputs.parameters.container_data_path}}"

          # 读取注册表
          with open(registry_path, 'r', encoding='utf-8') as f:
              registry = json.load(f)

          if dataset_name not in registry['datasets']:
              print(f"❌ 错误: 数据集 '{dataset_name}' 未在注册表中定义")
              sys.exit(1)

          dataset_config = registry['datasets'][dataset_name]

          print(f"\n✓ 找到数据集配置: {dataset_name}")
          print(f"  名称: {dataset_config.get('name')}")
          print(f"  任务类型: {dataset_config.get('task_type')}")
          print(f"  标签类型: {dataset_config.get('label_type')}")
          print(f"  训练脚本: {dataset_config.get('training_script')}")

          # 验证数据文件存在（数据文件在源码中）
          data_paths = dataset_config.get('data_paths', {})
          for split_name, file_path in data_paths.items():
              full_path = file_path  # 相对于 /src 的路径
              if not os.path.exists(full_path):
                  print(f"❌ 错误: {split_name} 数据文件不存在: {full_path}")
                  sys.exit(1)
              print(f"  ✓ {split_name}: {file_path}")

          # 验证配置文件（如果存在）
          config_path = dataset_config.get('config_path')
          if config_path:
              if not os.path.exists(config_path):
                  print(f"❌ 错误: 配置文件不存在: {config_path}")
                  sys.exit(1)
              print(f"  ✓ 配置文件: {config_path}")

          # 输出配置到文件（供后续步骤使用）
          output_file = "/tmp/dataset_config.json"
          with open(output_file, 'w', encoding='utf-8') as f:
              json.dump(dataset_config, f, ensure_ascii=False, indent=2)

          print(f"\n✓ 数据集配置已保存到: {output_file}")
          print("=" * 60)
        volumeMounts:
          - name: training-data-pvc
            mountPath: "{{inputs.parameters.container_data_path}}"
            readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

    # ==================== 3. 训练模型 ====================
    - name: train-model
      nodeSelector:
        nvidia.com/gpu.count: "1"
      podSpecPatch: '{"runtimeClassName":"nvidia"}'
      inputs:
        parameters:
          - name: dataset_name
          - name: model_name
          - name: batch_size
          - name: num_epochs
          - name: learning_rate
          - name: max_length
          - name: warmup_steps
          - name: weight_decay
          - name: model_version
          - name: container_model_cache_path
          - name: container_model_output_path
          - name: container_data_path
          - name: host_model_download_path
          - name: host_model_output_base_path
          - name: training_timestamp
          - name: output_suffix
        artifacts:
          - name: source-code
            path: /src
          - name: dataset-config
            path: /tmp/dataset_config.json
      volumes:
        - name: host-model-cache
          hostPath:
            path: "{{inputs.parameters.host_model_download_path}}"
            type: DirectoryOrCreate
        - name: host-model-output
          hostPath:
            path: "{{inputs.parameters.host_model_output_base_path}}/{{inputs.parameters.dataset_name}}-{{inputs.parameters.output_suffix}}"
            type: DirectoryOrCreate
        - name: training-data-pvc
          persistentVolumeClaim:
            claimName: "{{workflow.parameters.pvc_name}}"
      container:
        image: 192.168.68.95:31443/docker.io/pytorch/pytorch:2.2.0-cuda11.8-cudnn8-runtime
        command: [bash, -c]
        args:
          - |
            set -e

            echo "=========================================="
            echo "步骤3: 训练模型"
            echo "=========================================="

            cd /src

            # 安装依赖
            echo "安装训练依赖..."
            pip install --no-cache-dir "accelerate>=0.28.0" "transformers>=4.40.0"
            pip install --no-cache-dir \
              tokenizers>=0.15.0 \
              datasets>=2.14 \
              scikit-learn>=1.3.0 \
              pandas>=2.0.0 \
              numpy>=1.24.0 \
              scipy>=1.10.0 \
              tqdm>=4.65.0 \
              pyyaml>=6.0 \
              --index-url https://mirrors.aliyun.com/pypi/simple/ \
              --trusted-host mirrors.aliyun.com

            echo "✓ 依赖安装完成"

            # 配置环境
            export PYTHONPATH=/src/lib/python:$PYTHONPATH
            export TRANSFORMERS_CACHE="{{inputs.parameters.container_model_cache_path}}"
            export HF_HOME="{{inputs.parameters.container_model_cache_path}}"

            # 检测CUDA
            echo "检测CUDA环境..."
            python3 -c "import torch; print(f'CUDA可用: {torch.cuda.is_available()}'); print(f'GPU数量: {torch.cuda.device_count()}')"

            # 创建输出目录
            mkdir -p "{{inputs.parameters.container_model_output_path}}"

            # 读取数据集配置
            DATASET_CONFIG=$(cat /tmp/dataset_config.json)
            echo "数据集配置: $DATASET_CONFIG"

            # 构建训练命令（使用通用训练脚本）
            TRAIN_CMD="python3 /src/lib/python/train_universal.py \
              --dataset {{inputs.parameters.dataset_name}} \
              --registry datasets/dataset_registry.json \
              --output_dir {{inputs.parameters.container_model_output_path}}"

            # 添加可选参数（如果提供了值）
            [ -n "{{inputs.parameters.model_name}}" ] && TRAIN_CMD="$TRAIN_CMD --model_name {{inputs.parameters.model_name}}"
            [ -n "{{inputs.parameters.batch_size}}" ] && TRAIN_CMD="$TRAIN_CMD --batch_size {{inputs.parameters.batch_size}}"
            [ -n "{{inputs.parameters.num_epochs}}" ] && TRAIN_CMD="$TRAIN_CMD --num_epochs {{inputs.parameters.num_epochs}}"
            [ -n "{{inputs.parameters.learning_rate}}" ] && TRAIN_CMD="$TRAIN_CMD --learning_rate {{inputs.parameters.learning_rate}}"
            [ -n "{{inputs.parameters.max_length}}" ] && TRAIN_CMD="$TRAIN_CMD --max_length {{inputs.parameters.max_length}}"
            [ -n "{{inputs.parameters.warmup_steps}}" ] && TRAIN_CMD="$TRAIN_CMD --warmup_steps {{inputs.parameters.warmup_steps}}"
            [ -n "{{inputs.parameters.weight_decay}}" ] && TRAIN_CMD="$TRAIN_CMD --weight_decay {{inputs.parameters.weight_decay}}"
            [ -n "{{inputs.parameters.model_version}}" ] && TRAIN_CMD="$TRAIN_CMD --model_version {{inputs.parameters.model_version}}"

            echo "训练命令:"
            echo "$TRAIN_CMD"
            echo ""

            # 执行训练
            $TRAIN_CMD

            echo ""
            echo "=========================================="
            echo "训练完成！"
            echo "=========================================="
            echo "模型已保存到: {{inputs.parameters.container_model_output_path}}"
            echo "宿主机路径: {{inputs.parameters.host_model_output_base_path}}/{{inputs.parameters.dataset_name}}-{{inputs.parameters.output_suffix}}"

            # 创建完成标记
            {
                echo "训练完成时间: $(date -Iseconds)"
                echo "工作流UID: {{workflow.uid}}"
                echo "数据集名称: {{inputs.parameters.dataset_name}}"
                echo "宿主机保存路径: {{inputs.parameters.host_model_output_base_path}}/{{inputs.parameters.dataset_name}}-{{inputs.parameters.output_suffix}}"
            } > "{{inputs.parameters.container_model_output_path}}/training_completed.txt"

            echo "✓ 训练完成标记已创建"
        env:
          - name: PYTHONPATH
            value: "/src/lib/python"
          - name: TRANSFORMERS_CACHE
            value: "{{inputs.parameters.container_model_cache_path}}"
          - name: HF_HOME
            value: "{{inputs.parameters.container_model_cache_path}}"
          - name: CUDA_VISIBLE_DEVICES
            value: "0"
          - name: HTTPS_PROXY
            value: "{{workflow.parameters.https_proxy}}"
          - name: HTTP_PROXY
            value: "{{workflow.parameters.http_proxy}}"
          - name: https_proxy
            value: "{{workflow.parameters.https_proxy}}"
          - name: http_proxy
            value: "{{workflow.parameters.http_proxy}}"
        volumeMounts:
          - name: host-model-cache
            mountPath: "{{inputs.parameters.container_model_cache_path}}"
          - name: host-model-output
            mountPath: "{{inputs.parameters.container_model_output_path}}"
          - name: training-data-pvc
            mountPath: "{{inputs.parameters.container_data_path}}"
            readOnly: true
        resources:
          requests:
            memory: "16Gi"
            cpu: "8000m"
          limits:
            memory: "32Gi"
            cpu: "16000m"

    # ==================== 4. 验证模型 ====================
    - name: validate-model
      inputs:
        parameters:
          - name: container_model_output_path
          - name: dataset_name
          - name: output_suffix
      script:
        image: 192.168.68.95:31443/docker.io/library/python:3.10-slim
        command: [python3]
        source: |
          import json
          import os
          import sys

          print("=" * 60)
          print("步骤4: 验证模型")
          print("=" * 60)

          model_path = "{{inputs.parameters.container_model_output_path}}"

          # 检查必需文件
          required_files = [
              "config.json",
              "training_config.json"
          ]

          model_files = ["model.safetensors", "pytorch_model.bin"]

          print("\n检查模型文件:")
          model_found = any(os.path.exists(os.path.join(model_path, mf)) for mf in model_files)
          if not model_found:
              print(f"  ✗ 模型文件不存在 (需要: {model_files})")
              sys.exit(1)
          else:
              for mf in model_files:
                  if os.path.exists(os.path.join(model_path, mf)):
                      print(f"  ✓ {mf}")
                      break

          for file in required_files:
              file_path = os.path.join(model_path, file)
              if os.path.exists(file_path):
                  print(f"  ✓ {file}")
              else:
                  print(f"  ✗ {file} (缺失)")
                  sys.exit(1)

          # 读取训练配置
          with open(os.path.join(model_path, "training_config.json"), 'r', encoding='utf-8') as f:
              config = json.load(f)

          print(f"\n训练配置:")
          for key, value in config.items():
              if key != 'eval_results':
                  print(f"  {key}: {value}")

          # 显示评估结果（如果存在）
          if 'eval_results' in config:
              print(f"\n评估结果:")
              for key, value in config['eval_results'].items():
                  print(f"  {key}: {value}")

          # 计算模型大小
          model_size = sum(
              os.path.getsize(os.path.join(root, f))
              for root, dirs, files in os.walk(model_path)
              for f in files if os.path.isfile(os.path.join(root, f))
          )
          print(f"\n模型大小: {model_size / (1024*1024):.2f} MB")
          print("\n✓ 模型验证通过")
        volumeMounts:
          - name: host-model-output
            mountPath: "{{inputs.parameters.container_model_output_path}}"
            readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

    # ==================== 5. 生成训练报告 ====================
    - name: generate-training-report
      inputs:
        parameters:
          - name: container_model_output_path
          - name: dataset_name
          - name: output_suffix
          - name: workflow_uid
      script:
        image: 192.168.68.95:31443/docker.io/library/python:3.10-slim
        command: [python3]
        source: |
          import json
          import os
          import sys
          from datetime import datetime

          print("=" * 70)
          print("步骤5: 生成训练报告")
          print("=" * 70)

          model_path = "{{inputs.parameters.container_model_output_path}}"
          dataset_name = "{{inputs.parameters.dataset_name}}"
          workflow_uid = "{{inputs.parameters.workflow_uid}}"

          # 设置环境变量供报告生成脚本使用
          os.environ['WORKFLOW_UID'] = workflow_uid

          # 添加 lib/python 到路径
          lib_path = os.path.join(os.path.dirname(__file__), '..', 'lib', 'python')
          if lib_path not in sys.path:
              sys.path.insert(0, lib_path)

          print(f"\n📝 开始生成训练报告...")
          print(f"  模型路径: {model_path}")
          print(f"  数据集: {dataset_name}")
          print(f"  工作流UID: {workflow_uid}")

          # 检查模型目录是否存在
          if not os.path.exists(model_path):
              print(f"\n❌ 错误: 模型目录不存在: {model_path}")
              sys.exit(1)

          # 检查训练配置文件
          config_file = os.path.join(model_path, "training_config.json")
          if not os.path.exists(config_file):
              print(f"\n❌ 错误: 训练配置文件不存在: {config_file}")
              print("   训练可能未完成，无法生成报告")
              sys.exit(1)

          # 导入报告生成器
          try:
              from generate_training_report import generate_report

              # 生成报告
              print("\n调用报告生成器...")
              generate_report(model_path, dataset_name)

              print("\n" + "=" * 70)
              print("✅ 训练报告生成完成")
              print("=" * 70)

          except Exception as e:
              print(f"\n❌ 生成报告时出错: {str(e)}")
              import traceback
              traceback.print_exc()
              sys.exit(1)

        volumeMounts:
          - name: host-model-output
            mountPath: "{{inputs.parameters.container_model_output_path}}"
            readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

    # ==================== 主Pipeline ====================
    - name: universal-training-pipeline
      inputs:
        parameters:
          - name: dataset_name
          - name: dataset_registry_path
          - name: repo_url
          - name: branch
          - name: git_revision
          - name: pvc_name
          - name: host_model_download_path
          - name: host_model_output_base_path
          - name: training_timestamp
          - name: output_suffix
          - name: container_model_cache_path
          - name: container_model_output_path
          - name: container_data_path
          - name: model_name
          - name: batch_size
          - name: num_epochs
          - name: learning_rate
          - name: max_length
          - name: warmup_steps
          - name: weight_decay
          - name: model_version
      steps:
        # 步骤1: 拉取源码
        - - name: checkout
            template: checkout-source
            arguments:
              parameters:
                - name: repo_url
                  value: "{{inputs.parameters.repo_url}}"
                - name: branch
                  value: "{{inputs.parameters.branch}}"
                - name: git_revision
                  value: "{{inputs.parameters.git_revision}}"

        # 步骤2: 解析数据集配置
        - - name: parse-config
            template: parse-dataset-config
            arguments:
              parameters:
                - name: dataset_name
                  value: "{{inputs.parameters.dataset_name}}"
                - name: dataset_registry_path
                  value: "{{inputs.parameters.dataset_registry_path}}"
                - name: container_data_path
                  value: "{{inputs.parameters.container_data_path}}"
              artifacts:
                - name: source-code
                  from: "{{steps.checkout.outputs.artifacts.source-code}}"

        # 步骤3: 训练模型
        - - name: train
            template: train-model
            arguments:
              parameters:
                - name: dataset_name
                  value: "{{inputs.parameters.dataset_name}}"
                - name: model_name
                  value: "{{inputs.parameters.model_name}}"
                - name: batch_size
                  value: "{{inputs.parameters.batch_size}}"
                - name: num_epochs
                  value: "{{inputs.parameters.num_epochs}}"
                - name: learning_rate
                  value: "{{inputs.parameters.learning_rate}}"
                - name: max_length
                  value: "{{inputs.parameters.max_length}}"
                - name: warmup_steps
                  value: "{{inputs.parameters.warmup_steps}}"
                - name: weight_decay
                  value: "{{inputs.parameters.weight_decay}}"
                - name: model_version
                  value: "{{inputs.parameters.model_version}}"
                - name: container_model_cache_path
                  value: "{{inputs.parameters.container_model_cache_path}}"
                - name: container_model_output_path
                  value: "{{inputs.parameters.container_model_output_path}}"
                - name: container_data_path
                  value: "{{inputs.parameters.container_data_path}}"
                - name: host_model_download_path
                  value: "{{inputs.parameters.host_model_download_path}}"
                - name: host_model_output_base_path
                  value: "{{inputs.parameters.host_model_output_base_path}}"
                - name: training_timestamp
                  value: "{{inputs.parameters.training_timestamp}}"
                - name: output_suffix
                  value: "{{inputs.parameters.output_suffix}}"
              artifacts:
                - name: source-code
                  from: "{{steps.checkout.outputs.artifacts.source-code}}"
                - name: dataset-config
                  from: "{{steps.parse-config.outputs.artifacts.dataset-config}}"

        # 步骤4: 验证模型
        - - name: validate
            template: validate-model
            arguments:
              parameters:
                - name: container_model_output_path
                  value: "{{inputs.parameters.container_model_output_path}}"
                - name: dataset_name
                  value: "{{inputs.parameters.dataset_name}}"
                - name: output_suffix
                  value: "{{inputs.parameters.output_suffix}}"

        # 步骤5: 生成训练报告
        - - name: generate-report
            template: generate-training-report
            arguments:
              parameters:
                - name: container_model_output_path
                  value: "{{inputs.parameters.container_model_output_path}}"
                - name: dataset_name
                  value: "{{inputs.parameters.dataset_name}}"
                - name: output_suffix
                  value: "{{inputs.parameters.output_suffix}}"
                - name: workflow_uid
                  value: "{{inputs.parameters.output_suffix}}"
